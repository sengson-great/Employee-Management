services:
  db:
    image: mysql:8.0
    container_name: mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: employee_db
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3307:3306" # You can still access it from your Mac via 3307

  app:
    build: .
    container_name: spring-app
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      # 1. Use 'db' instead of 'localhost'
      # 2. Use 'employee_db' instead of 'task-management'
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/employee_db?allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      # 3. Match the password defined above
      SPRING_DATASOURCE_PASSWORD: rootpassword

volumes:
  mysql-data: