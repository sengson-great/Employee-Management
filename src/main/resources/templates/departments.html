<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Departments</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f5f7fa;
            color: #333;
            line-height: 1.6;
            padding: 20px;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
        }
        header {
            background: linear-gradient(135deg, #2c3e50, #4a6491);
            color: white;
            padding: 25px 30px;
            border-radius: 10px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        h1 i {
            font-size: 2.2rem;
        }
        .subtitle {
            font-size: 1.1rem;
            opacity: 0.9;
        }
        
        .alert {
            padding: 15px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            flex-wrap: wrap;
            gap: 15px;
        }
        .create-form {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        .create-form input[type="text"] {
            flex-grow: 1;
            padding: 12px 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            padding: 12px 20px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-add {
            background-color: #2ecc71;
        }
        .btn-add:hover {
            background-color: #27ae60;
        }

        .department-list {
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }
        table {
            width: 100%;
            border-collapse: collapse;
        }
        thead {
            background-color: #f8f9fa;
        }
        th {
            padding: 18px 15px;
            text-align: left;
            font-weight: 600;
            color: #2c3e50;
            border-bottom: 2px solid #eee;
        }
        td {
            padding: 18px 15px;
            border-bottom: 1px solid #eee;
        }
        tr:hover {
            background-color: #f9f9f9;
        }
        
        .actions {
            display: flex;
            gap: 10px;
        }
        .action-btn {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }
        .edit-btn {
            background-color: #e3f2fd;
            color: #1976d2;
        }
        .delete-btn {
            background-color: #ffebee;
            color: #d32f2f;
        }
        .action-btn:hover {
            transform: scale(1.1);
        }
        
        .no-results {
            text-align: center;
            padding: 50px 20px;
            color: #777;
        }
        .no-results i {
            font-size: 3rem;
            margin-bottom: 15px;
            color: #ddd;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
        }
        .modal-content {
            background-color: #fefefe;
            padding: 30px;
            border-radius: 10px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            position: relative;
        }
        .close {
            position: absolute;
            right: 20px;
            top: 15px;
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }
        .close:hover {
            color: #333;
        }
        .modal-body {
            margin-top: 10px;
        }
        .modal-body input {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 1rem;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        
        nav.back-nav {
            margin-bottom: 20px;
        }
        nav.back-nav a {
            color: #3498db;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 500;
        }
        nav.back-nav a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
<div class="container">

    <nav class="back-nav">
        <a href="/"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
    </nav>

    <header>
        <h1><i class="fas fa-building"></i> Departments</h1>
        <p class="subtitle">Manage company departments</p>
    </header>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-error" th:text="${error}"></div>

    <div class="controls">
        <form th:action="@{/departments}" th:object="${createDepartmentRequest}" method="post" class="create-form">
            <input type="text" th:field="*{name}" placeholder="New Department Name" required>
            <button type="submit" class="btn-add" sec:authorize="hasAnyRole('ADMIN', 'HR')">
                <i class="fas fa-plus"></i> Add Department
            </button>
        </form>
    </div>

    <div class="department-list">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="dept : ${departments}">
                    <td th:text="${dept.id}">1</td>
                    <td th:text="${dept.name}">Sales</td>
                    <td>
                        <div class="actions">
                            <button class="action-btn edit-btn"
                                    th:attr="data-id=${dept.id}, data-name=${dept.name}"
                                    onclick="openEditModal(this)"
                                    title="Edit Department"
                                    sec:authorize="hasRole('ADMIN')">
                                <i class="fas fa-edit"></i>
                            </button>
                            <form th:action="@{/departments/{id}/delete(id=${dept.id})}" method="post" style="display: inline;" onsubmit="return confirm('Are you sure you want to delete this department?');">
                                <button type="submit" class="action-btn delete-btn" title="Delete Department" sec:authorize="hasRole('ADMIN')">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(departments)}">
                    <td colspan="3">
                        <div class="no-results">
                            <i class="fas fa-building-circle-exclamation"></i>
                            <h3>No departments found</h3>
                            <p>Try adding a department first.</p>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>

<!-- Edit Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <span class="close" onclick="closeEditModal()">&times;</span>
        <h2>Edit Department</h2>
        <div class="modal-body">
            <form id="editForm" method="post">
                <label for="editName" style="display: block; margin-bottom: 8px; font-weight: 500;">Department Name:</label>
                <input type="text" id="editName" name="name" required>
                <div class="modal-footer">
                    <button type="button" onclick="closeEditModal()" style="background-color: #95a5a6;">Cancel</button>
                    <button type="submit" class="btn-add">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    function openEditModal(id, name) {
        document.getElementById('editModal').style.display = 'flex';
        document.getElementById('editName').value = name;
        document.getElementById('editForm').action = '/departments/' + id + '/update';
    }

    function closeEditModal() {
        document.getElementById('editModal').style.display = 'none';
    }

    window.onclick = function(event) {
        const modal = document.getElementById('editModal');
        if (event.target === modal) {
            closeEditModal();
        }
    }
</script>
</body>
</html>
