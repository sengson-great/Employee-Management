<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Secure Portal</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
        background: #E4E7EB;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
    }

    .login-container {
        width: 100%;
        max-width: 420px;
        background-color: rgba(255, 255, 255, 0.95);
        border-radius: 20px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        overflow: hidden;
        transition: transform 0.3s ease;
    }

    .login-container:hover {
        transform: translateY(-5px);
    }

    .login-header {
        background: linear-gradient(to right, #4a00e0, #8e2de2);
        color: white;
        padding: 30px 20px;
        text-align: center;
    }

    .login-header h1 {
        font-size: 28px;
        margin-bottom: 8px;
        font-weight: 700;
    }

    .login-header p {
        opacity: 0.9;
        font-size: 15px;
    }

    .login-form {
        padding: 30px;
    }

    .form-group {
        margin-bottom: 22px;
        position: relative;
    }

    .form-group label {
        display: block;
        margin-bottom: 8px;
        color: #333;
        font-weight: 600;
        font-size: 14px;
    }

    .input-with-icon {
        position: relative;
    }

    .input-with-icon i {
        position: absolute;
        left: 16px;
        top: 50%;
        transform: translateY(-50%);
        color: #777;
        font-size: 18px;
    }

    .form-control {
        width: 100%;
        padding: 15px 15px 15px 50px;
        border: 2px solid #e1e5ee;
        border-radius: 10px;
        font-size: 16px;
        transition: all 0.3s;
        background-color: #f8f9fa;
    }

    .form-control:focus {
        border-color: #6a11cb;
        background-color: white;
        outline: none;
        box-shadow: 0 0 0 3px rgba(106, 17, 203, 0.1);
    }

    .password-toggle {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        background: none;
        border: none;
        color: #777;
        cursor: pointer;
        font-size: 18px;
    }

    .password-toggle:hover {
        color: #333;
    }

    .login-btn {
        width: 100%;
        padding: 16px;
        background: linear-gradient(to right, #4a00e0, #8e2de2);
        color: white;
        border: none;
        border-radius: 10px;
        font-size: 17px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        margin-top: 10px;
        letter-spacing: 0.5px;
    }

    .login-btn:hover {
        background: linear-gradient(to right, #3a00b0, #7a1dd2);
        box-shadow: 0 5px 15px rgba(106, 17, 203, 0.3);
    }

    .login-btn:active {
        transform: translateY(2px);
    }

    .divider {
        display: flex;
        align-items: center;
        margin: 25px 0;
        color: #888;
    }

    .divider::before, .divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background-color: #ddd;
    }

    .divider span {
        padding: 0 15px;
        font-size: 14px;
    }

    .signup-link {
        text-align: center;
        margin-top: 25px;
        color: #555;
        font-size: 15px;
    }

    .signup-link a {
        color: #4a00e0;
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s;
    }

    .signup-link a:hover {
        color: #8e2de2;
        text-decoration: underline;
    }

    .alert {
        padding: 14px 18px;
        border-radius: 10px;
        margin-bottom: 25px;
        font-size: 15px;
        display: flex;
        align-items: center;
        animation: fadeIn 0.5s;
    }

    .alert-error {
        background-color: #ffeaea;
        color: #d32f2f;
        border-left: 5px solid #d32f2f;
    }

    .alert-success {
        background-color: #e8f5e9;
        color: #2e7d32;
        border-left: 5px solid #2e7d32;
    }

    .alert i {
        margin-right: 12px;
        font-size: 20px;
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 480px) {
        .login-container {
            border-radius: 15px;
        }

        .login-header {
            padding: 25px 15px;
        }

        .login-form {
            padding: 25px 20px;
        }
    }

    .forgot-password {
        text-align: right;
        margin-top: 8px;
    }

    .forgot-password a {
        color: #666;
        font-size: 14px;
        text-decoration: none;
    }

    .forgot-password a:hover {
        color: #4a00e0;
        text-decoration: underline;
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-header">
    <h1>Welcome Back</h1>
    <p>Sign in to access your account</p>
  </div>

  <div class="login-form">
    <!-- Error Message -->
    <div th:if="${param.error}" class="alert alert-error">
      <i class="fas fa-exclamation-circle"></i>
      <div>
        <strong>Invalid credentials</strong><br>
        Please check your email and password and try again.
      </div>
    </div>

    <!-- Logout Message -->
    <div th:if="${param.logout}" class="alert alert-success">
      <i class="fas fa-check-circle"></i>
      <div>
        <strong>Successfully logged out</strong><br>
        You have been safely logged out of your account.
      </div>
    </div>

    <form th:action="@{/login}" method="post">
      <div class="form-group">
        <label for="email">Email Address</label>
        <div class="input-with-icon">
          <i class="fas fa-envelope"></i>
          <input type="email" id="email" name="username" class="form-control" placeholder="Enter your email" required>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-with-icon">
          <i class="fas fa-lock"></i>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
          <button type="button" class="password-toggle" id="togglePassword">
            <i class="fas fa-eye"></i>
          </button>
        </div>
        <div class="forgot-password">
          <a href="#">Forgot password?</a>
        </div>
      </div>

      <button type="submit" class="login-btn">
        <i class="fas fa-sign-in-alt" style="margin-right: 8px;"></i>
        Sign In
      </button>

      <div class="divider">
        <span>New to our platform?</span>
      </div>

      <div class="signup-link">
        Don't have an account? <a th:href="@{/signup}">Create Account</a>
      </div>
    </form>
  </div>
</div>

<script>
  // Toggle password visibility
  document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const icon = this.querySelector('i');

      if (passwordInput.type === 'password') {
          passwordInput.type = 'text';
          icon.classList.remove('fa-eye');
          icon.classList.add('fa-eye-slash');
      } else {
          passwordInput.type = 'password';
          icon.classList.remove('fa-eye-slash');
          icon.classList.add('fa-eye');
      }
  });

  // Add focus effects to form inputs
  const formControls = document.querySelectorAll('.form-control');
  formControls.forEach(control => {
      // Add focus effect
      control.addEventListener('focus', function() {
          this.parentElement.parentElement.classList.add('focused');
      });

      // Remove focus effect
      control.addEventListener('blur', function() {
          if (this.value === "") {
              this.parentElement.parentElement.classList.remove('focused');
          }
      });

      // Check if input has value on page load (for browser autofill)
      if (control.value !== "") {
          control.parentElement.parentElement.classList.add('focused');
      }
  });

  // Simple form validation
  const loginForm = document.querySelector('form');
  loginForm.addEventListener('submit', function(event) {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
          // Prevent form submission
          event.preventDefault();

          // Highlight empty fields
          if (!email) {
              document.getElementById('email').style.borderColor = '#d32f2f';
          }
          if (!password) {
              document.getElementById('password').style.borderColor = '#d32f2f';
          }

          // Show error message if not already present
          if (!document.querySelector('.alert-error:not([th\\:if])')) {
              const alertDiv = document.createElement('div');
              alertDiv.className = 'alert alert-error';
              alertDiv.innerHTML = `
                  <i class="fas fa-exclamation-circle"></i>
                  <div>
                      <strong>Please fill in all fields</strong><br>
                      Both email and password are required to sign in.
                  </div>
              `;

              // Insert at the beginning of the form
              loginForm.insertBefore(alertDiv, loginForm.firstChild);

              // Remove the error after 5 seconds
              setTimeout(() => {
                  if (alertDiv.parentNode) {
                      alertDiv.style.opacity = '0';
                      alertDiv.style.transition = 'opacity 0.5s';
                      setTimeout(() => alertDiv.remove(), 500);
                  }
              }, 5000);
          }
      }
  });

  // Reset border color when user starts typing
  formControls.forEach(control => {
      control.addEventListener('input', function() {
          this.style.borderColor = '#e1e5ee';
      });
  });
</script>
</body>
</html>
