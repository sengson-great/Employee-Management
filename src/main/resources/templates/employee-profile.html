<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Employee Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #f5f7fa; font-family: 'Segoe UI', sans-serif; padding: 40px; }
        .profile-container { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }

        /* Header Section */
        .profile-header { padding: 40px; color: white; text-align: center; position: relative; }
        .profile-avatar { width: 120px; height: 120px; border-radius: 50%; border: 5px solid rgba(255,255,255,0.3); margin: 0 auto 15px; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: bold; }

        /* Content Section */
        .profile-body { padding: 40px; display: grid; grid-template-columns: 1fr 1fr; gap: 30px; }
        .info-group { margin-bottom: 20px; }
        .info-label { color: #888; font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; }
        .info-value { font-size: 1.1rem; color: #2c3e50; font-weight: 600; }

        /* Badges */
        .badge { padding: 5px 15px; border-radius: 50px; font-size: 0.8rem; }
        .bg-active { background: #d4edda; color: #155724; }

        .actions { padding: 20px 40px; background: #f8f9fa; border-top: 1px solid #eee; display: flex; justify-content: space-between; }
        .btn { padding: 10px 20px; border-radius: 8px; text-decoration: none; font-weight: 600; transition: 0.3s; }
        .btn-back { color: #666; }
        .btn-edit { background: #3498db; color: white; }
    </style>
</head>
<body>

<div class="profile-container">
    <div class="profile-header" th:style="'background: ' + ${avatarColor}">
        <div class="profile-avatar">
            <span th:text="${employee.fullName != null && !employee.fullName.isEmpty() ? #strings.substring(employee.fullName, 0, 1) : '?'}">J</span>
        </div>
        <h1 th:text="${employee.fullName}">John Doe</h1>
        <p th:text="${employee.position}">Senior Developer</p>
    </div>

    <div class="profile-body">
        <div class="info-group">
            <div class="info-label"><i class="fas fa-envelope"></i> Email Address</div>
            <div class="info-value" th:text="${employee.user?.email}">john@company.com</div>
        </div>
        <div class="info-group">
            <div class="info-label"><i class="fas fa-building"></i> Department</div>
            <div class="info-value" th:text="${employee.department != null ? employee.department.name : 'None'}">IT</div>
        </div>
        <div class="info-group">
            <div class="info-label"><i class="fas fa-calendar-alt"></i> Join Date</div>
            <div class="info-value" th:text="${#temporals.format(employee.hireDate, 'MMMM dd, yyyy')}">Jan 01, 2023</div>
        </div>
        <div class="info-group">
            <div class="info-label"><i class="fas fa-toggle-on"></i> Status</div>
            <div class="info-value">
                <span class="badge" th:classappend="${employee.status == 'Active' ? 'bg-active' : 'bg-inactive'}"
                      th:text="${employee.status}">Active</span>
            </div>
        </div>
    </div>

    <div class="actions">
        <a th:href="@{/}" class="btn btn-back">
            <i class="fas fa-arrow-left"></i> Back to Directory
        </a>
        <a th:href="@{/admin/{id}/edit(id=${employee.id})}" class="btn btn-edit" sec:authorize="hasRole('ADMIN')">
            <i class="fas fa-edit"></i> Edit Profile
        </a>
    </div>
</div>

</body>
</html>
